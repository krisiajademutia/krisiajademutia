name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: krisiajademutia
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23FF8FC7&color_dots=%23E8F7FF,%23C9EEFF,%2387CEEB,%23FFB6D9,%23FF8FC7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFB6D9&color_dots=%230D1117,%232A6078,%2387CEEB,%23FFB6D9,%23FF8FC7

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
