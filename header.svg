  <path d="M15 38 L24 4 L48 24 L78 24 L102 4 L110 38 Z" fill="#87ceeb"/>
  <circle cx="62" cy="72" r="58" fill="#dff7ff"/>
  <circle cx="43" cy="68" r="5" fill="#355070"/>
  <circle cx="81" cy="68" r="5" fill="#355070"/>
