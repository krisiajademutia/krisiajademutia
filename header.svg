  <path d="M30 118 q30 22 62 0" fill="none" stroke="#87ceeb" stroke-width="10" stroke-linecap="round"/>
</g>

<!-- waves -->
<path d="M0 220 C160 160 280 285 450 220 S760 160 930 220 S1090 285 1200 210 L1200 330 L0 330 Z"
      fill="#ffb6d9" opacity=".88"/>
<path d="M0 245 C170 190 285 315 470 245 S770 185 950 245 S1090 305 1200 235 L1200 330 L0 330 Z"
      fill="#87ceeb" opacity=".82"/>
<path d="M0 270 C160 220 300 330 500 270 S820 215 1010 270 S1120 315 1200 265 L1200 330 L0 330 Z"
      fill="#ffffff" opacity=".78"/>

<!-- flowers -->
<g transform="translate(290 220)">
  <circle cx="0" cy="0" r="9" fill="#ffd6e9"/><circle cx="18" cy="-5" r="9" fill="#ffb6d9"/>
  <circle cx="13" cy="14" r="9" fill="#ffd6e9"/><circle cx="-10" cy="14" r="9" fill="#ffb6d9"/>
