<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fff0f8"/>
    <stop offset="52%" stop-color="#dff5ff"/>
    <stop offset="100%" stop-color="#ffe2f1"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffb6d9"/>
    <stop offset="50%" stop-color="#87ceeb"/>
    <stop offset="100%" stop-color="#ffb6d9"/>
  </linearGradient>
</defs>

<rect width="1200" height="330" rx="34" fill="url(#sky)"/>

<!-- sparkles -->
<g fill="#ffffff" opacity=".95">
  <text x="110" y="72" font-size="34">✦</text>
  <text x="1020" y="78" font-size="30">✧</text>
  <text x="890" y="52" font-size="22">✦</text>
  <text x="250" y="55" font-size="22">✧</text>
</g>

<!-- title -->
<text x="600" y="102" text-anchor="middle" font-family="Arial, sans-serif"
      font-size="48" font-weight="700" fill="#355070">Krisia Jade</text>
<text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif"
      font-size="21" fill="#4b7190">AI • Machine Learning • Web • Mobile</text>

<!-- cute bunny -->
<g transform="translate(130 112)">
  <ellipse cx="55" cy="83" rx="48" ry="54" fill="#fff"/>
  <ellipse cx="30" cy="18" rx="14" ry="45" fill="#fff"/>
  <ellipse cx="78" cy="18" rx="14" ry="45" fill="#fff"/>
  <ellipse cx="30" cy="18" rx="7" ry="35" fill="#ffb6d9"/>
  <ellipse cx="78" cy="18" rx="7" ry="35" fill="#ffb6d9"/>
  <circle cx="38" cy="78" r="5" fill="#355070"/>
  <circle cx="72" cy="78" r="5" fill="#355070"/>
  <circle cx="55" cy="91" r="5" fill="#ff9fc8"/>
  <path d="M55 95 q-9 14 -18 4 M55 95 q9 14 18 4" fill="none" stroke="#355070" stroke-width="3"/>
  <circle cx="17" cy="91" r="8" fill="#ffb6d9" opacity=".7"/>
  <circle cx="93" cy="91" r="8" fill="#ffb6d9" opacity=".7"/>
</g>

<!-- cute cat -->
